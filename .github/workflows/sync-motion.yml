name: Sync motion asset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', '[asset-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download motion source from Drive
        run: |
          mkdir -p assets
          python -m pip install -q gdown
          gdown "https://drive.google.com/uc?id=1HXv53PcujF070fi1vh8Jiy7CKn2gZcEN" -O assets/motion.mp4
          test $(wc -c < assets/motion.mp4) -gt 5000000
          file assets/motion.mp4 | grep -qi 'MP4'
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/motion.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add original motion asset [asset-sync]"
          git push
