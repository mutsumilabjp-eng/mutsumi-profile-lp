name: Deploy Mutsumi to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is missing" && exit 1)

      - name: Deploy
        run: npx --yes wrangler@4.144.0 deploy --config wrangler.jsonc

      - name: Verify production
        run: |
          URL=$(npx --yes wrangler@4.144.0 deployments status --config wrangler.jsonc 2>/dev/null | grep -Eo 'https://[^ ]+\.workers\.dev' | head -1 || true)
          if [ -n "$URL" ]; then
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$URL/" -o /tmp/mutsumi.html
            grep -q 'AIに仕事を振っています' /tmp/mutsumi.html
            grep -q 'https://coconala.com/services/4422153' /tmp/mutsumi.html
            grep -q 'https://note.com/mutsumi_lab_jp' /tmp/mutsumi.html
          fi
